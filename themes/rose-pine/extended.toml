# extended.toml — Rose Pine Dawn: full 15 roles of the official design system.
# Source: https://github.com/rose-pine/palette/blob/main/palette.json (+ spec:
# https://github.com/rose-pine/palette — roles with usage).
#
# This file only fills GAPS. colors.toml always takes precedence:
#   1. colors.toml (Omarchy keys; partly deliberately deviating, e.g. foreground
#      #575279 instead of the official text #464261, muted #cecacd = highlight_high)
#   2. extended.toml (this file, official role values)
#   3. ROLE_SOURCES fallback chains in src/palette.ts
#
# The resolution is governed declaratively in src/palette.ts (ROLE_SOURCES);
# renderers work only with role names (Palette), never with raw keys.

mode = "light"

# --- Surface roles (official) ---
surface = "#fffaf3"
overlay = "#f2e9e1"

# --- Foreground roles (official) ---
subtle = "#797593"

# --- Accent roles (official; usage see palette spec) ---
love = "#b4637a"
gold = "#ea9d34"
rose = "#d7827e"
pine = "#286983"
foam = "#56949f"
iris = "#907aa9"

# --- Highlight roles (official; defined upstream as alpha overlays,
# here the established Dawn hex values; consistent with selection/muted) ---
highlight_low = "#f4ede8"
highlight_med = "#dfdad9"
highlight_high = "#cecacd"
